<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Days in Norway</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>When is the next red day?</h2>

        <div class="controls" aria-label="Display controls">
            <label for="locale-select">Language:</label>
            <select id="locale-select">
                <option value="en-NO">English</option>
                <option value="nb-NO">Norsk bokmål</option>
            </select>
        </div>

        <div class="date-navigation">
            <button class="arrow left" type="button" aria-label="Show previous red day">&#9664;</button>
            <div class="date-display" aria-live="polite">
                <h1 id="day-number">25</h1>
                <p id="weekday">Wednesday</p>
                <h2 id="month">December</h2>
            </div>
            <button class="arrow right" type="button" aria-label="Show next red day">&#9654;</button>
        </div>
    </div>

    <div class="red-day-name">
        <p id="red-day-name">Independence of Norway</p>
        <p id="days-until" class="days-until">In 0 days</p>
    </div>

    <div class="calendar-container">
        <p id="calendar-year">2024</p>
        <div class="calendar-weekdays" id="calendar-weekdays" aria-hidden="true"></div>
        <div id="calendar" class="calendar" role="grid" aria-label="Month calendar"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
